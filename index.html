<!doctype html>
<html lang="fr" data-skin="aka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Forge">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shojumaru&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Potta+One&display=swap&text=%E9%8D%9B%E9%8C%AC%E5%8A%9B%E5%8B%9D%E5%88%A9%E6%B0%97%E5%90%88%E6%A0%B9%E6%80%A7%E4%B8%80%E7%95%AA%E3%82%B7%E3%83%90%E3%83%91%E3%83%A3%E3%83%B3%E3%83%89%E3%83%83%EF%BC%81">

<style>
/* Layout : appli mobile façon manga japonais — fond rouge à vagues seigaiha, cases de manga sur papier blanc encrées, titres en lettrage d'inspiration japonaise, sceaux hanko ; en-tête collant, un écran par onglet, barre d'onglets en bas, panneaux qui montent du bas.
   Teintes (data-skin) : Aka (rouge, défaut), Ai (indigo), Sakura (rose), Matcha (vert). Ambiance claire unique, assumée. */
:root{
  --bg:#c8102e; --wave:#d8243f; --paper:#fffdf8; --card:#fffdf8; --card2:#f6efe3; --card3:#ebe2d3; --soft:#f6efe3;
  --ink:#1a1716; --fg:#1a1716; --mute:#6f665f; --line:#e7dccb; --line2:#1a1716;
  --accent:#c8102e; --onacc:#ffffff; --ai:#23395d; --sun:#f2b632; --mint:#3f8f4f; --red:#d0102e;
  --font:Arial, "Helvetica Neue", Helvetica, sans-serif; --jp:"Shojumaru", "Arial Black", Arial, sans-serif; --kanji:"Potta One", "Hiragino Mincho ProN", "Yu Mincho", serif; --heavy:var(--jp);
  color-scheme:light;
}
:root[data-skin="ai"]{--bg:#23395d;--wave:#2d4772;--accent:#23395d}
:root[data-skin="sakura"]{--bg:#e9799c;--wave:#ef8fad;--accent:#d24f7a}
:root[data-skin="matcha"]{--bg:#5b7f3a;--wave:#668d43;--accent:#4f7a2e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background-color:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;
  background-image:
   radial-gradient(circle at 100% 150%,var(--bg) 24%,var(--wave) 25%,var(--wave) 28%,var(--bg) 29%,var(--bg) 36%,var(--wave) 36%,var(--wave) 40%,transparent 40%,transparent),
   radial-gradient(circle at 0 150%,var(--bg) 24%,var(--wave) 25%,var(--wave) 28%,var(--bg) 29%,var(--bg) 36%,var(--wave) 36%,var(--wave) 40%,transparent 40%,transparent),
   radial-gradient(circle at 50% 100%,var(--wave) 10%,var(--bg) 11%,var(--bg) 23%,var(--wave) 24%,var(--wave) 30%,var(--bg) 31%,var(--bg) 43%,var(--wave) 44%,var(--wave) 50%,var(--bg) 51%,var(--bg) 63%,var(--wave) 64%,var(--wave) 71%,transparent 71%,transparent),
   radial-gradient(circle at 100% 50%,var(--wave) 5%,var(--bg) 6%,var(--bg) 15%,var(--wave) 16%,var(--wave) 20%,var(--bg) 21%,var(--bg) 30%,var(--wave) 31%,var(--wave) 35%,var(--bg) 36%,var(--bg) 45%,var(--wave) 46%,var(--wave) 49%,transparent 50%,transparent),
   radial-gradient(circle at 0 50%,var(--wave) 5%,var(--bg) 6%,var(--bg) 15%,var(--wave) 16%,var(--wave) 20%,var(--bg) 21%,var(--bg) 30%,var(--wave) 31%,var(--wave) 35%,var(--bg) 36%,var(--bg) 45%,var(--wave) 46%,var(--wave) 49%,transparent 50%,transparent);
  background-size:72px 36px;background-attachment:fixed}
body.noscroll{overflow:hidden}
.wm{position:fixed;right:-4px;top:110px;writing-mode:vertical-rl;font-family:var(--kanji);font-size:120px;line-height:1;color:#fff;opacity:.13;pointer-events:none;z-index:0;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.mz:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,select,textarea{font:inherit;font-weight:700;width:100%;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:3px;padding:9px 11px;min-width:0}
textarea{font-weight:400;font-size:14px;min-height:80px;resize:vertical}
input[type=range]{padding:0;border:0;accent-color:var(--accent)}
.app{position:relative;z-index:1;max-width:500px;margin:0 auto;padding-inline:14px;padding-block:10px 120px}
.panel{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:3px;box-shadow:5px 5px 0 rgba(26,23,22,.85);padding:14px 16px;min-width:0}
.panel.tight{padding:6px 10px}
.panel.tint{background:#fff7dc;border-color:var(--ink)}
.stack{display:grid;gap:16px}
.stack>.sub{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.mute{color:var(--mute);font-weight:700}
.sub{font-size:13px;color:var(--mute);font-weight:700}
.small{font-size:13px}
.center{text-align:center}
.cap::first-letter{text-transform:uppercase}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.h2{font-family:var(--jp);font-weight:400;font-size:19px;letter-spacing:.02em}
.lbl{font-size:11.5px;font-weight:700;color:var(--mute);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.1em}
.blk{margin-top:18px}
.sticker{display:inline-block;font-family:var(--jp);font-weight:400;font-size:13px;letter-spacing:.04em;background:var(--accent);color:#fff;padding:4px 14px 3px;margin:0 0 12px -4px;border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);transform:rotate(-1.5deg)}
.sticker.b,.sticker.m{background:var(--ink)}
.sticker.v{background:var(--ai)}
.pill{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 9px;border:2px solid var(--ink);background:#fff;color:var(--ink);white-space:nowrap;vertical-align:1px;border-radius:99px}
.pill.gold{background:var(--sun)}
.linkb{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.linkb.danger{color:var(--red)}
.btn{font-family:var(--jp);font-weight:400;font-size:15px;letter-spacing:.03em;background:var(--accent);color:#fff;border:3px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--ink);padding:9px 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.big{font-size:18px;padding:12px 20px}
.btn.sm{font-size:13px;padding:6px 11px;border-width:2.5px;box-shadow:2px 2px 0 var(--ink)}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red);box-shadow:2px 2px 0 var(--red)}
.btn:disabled{background:#e9e2d6;color:#9a918a;box-shadow:none}
.ico{flex:none;background:none;border:0;color:var(--mute);font-size:17px;font-weight:700;padding:6px 8px;min-width:36px;min-height:36px}
.ico.danger{color:var(--red)}
.ico[data-armed]{color:var(--red);font-size:12px}
/* en-tête */
.top{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5}
.logo{flex:none;width:50px;height:50px}.logo svg{width:100%;height:100%}
.top .nm{font-family:var(--jp);font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
.lvl{font-family:var(--font);font-size:11px;font-weight:900;background:var(--ink);color:#fff;padding:2px 9px;margin-left:4px;vertical-align:4px;letter-spacing:0;display:inline-block;border-radius:99px}
.xp{height:13px;border:2.5px solid var(--ink);background:#fff;overflow:hidden;margin-top:6px;border-radius:99px}
.xp.thin{height:10px;border-width:2px}
.xp i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--accent) 0 7px,color-mix(in srgb,var(--accent) 75%,#fff) 7px 12px);transition:width .5s}
.gearb{flex:none;width:44px;height:44px;border:2.5px solid var(--ink);border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}
/* navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;pointer-events:none}
.nav .in{pointer-events:auto;width:calc(100% - 20px);max-width:480px;margin-bottom:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 var(--ink);padding:6px}
.nb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;color:var(--mute);min-width:0;border-radius:4px}
.nb span{font-size:10.5px;font-weight:700;white-space:nowrap}
.nb[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
/* cases de manga (schémas) */
.speed,.th,.thumb,.mini,.animbox,.bmw,.scanhero{background-color:#fff;color:var(--ink)}
.th,.thumb,.mini{background-image:radial-gradient(circle at 50% 55%,#fff 0 25%,rgba(255,255,255,0) 70%),repeating-conic-gradient(from 0deg at 50% 55%,rgba(0,0,0,0) 0deg 5deg,rgba(0,0,0,.08) 5deg 6deg)}
.speed,.animbox,.scanhero{background-image:radial-gradient(circle at 50% 50%,#fff 0 18%,rgba(255,255,255,0) 60%),repeating-conic-gradient(from 0deg at 50% 50%,rgba(0,0,0,0) 0deg 3deg,rgba(0,0,0,.09) 3deg 3.8deg)}
/* accueil */
.exbar{display:flex;gap:12px;align-items:center}
.hero{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.panel.heroP{overflow:hidden;background-color:#fff;background-image:radial-gradient(circle at 16% 50%,#fff 0 12%,rgba(255,255,255,0) 55%),repeating-conic-gradient(from 0deg at 16% 50%,rgba(0,0,0,0) 0deg 3deg,rgba(0,0,0,.08) 3deg 3.8deg)}
.sfx{position:absolute;right:8px;top:4px;writing-mode:vertical-rl;font-family:var(--kanji);font-size:40px;line-height:1.05;color:var(--accent);opacity:.9;pointer-events:none;z-index:0;user-select:none;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke}
.hi{font-family:var(--jp);font-size:22px;line-height:1.1;letter-spacing:.02em;padding-right:44px}
.nx{display:flex;flex-direction:column;margin-bottom:10px}.nx b{font-family:var(--jp);font-weight:400;font-size:22px}.nx span{color:var(--mute);font-weight:700;font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.th{border:2.5px solid var(--ink);padding:3px;text-align:center;min-width:0;border-radius:3px}
.th span{display:block;font-size:10.5px;font-weight:700;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fig{display:block;width:100%;height:auto}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:#fff;border:2.5px solid var(--ink);border-radius:3px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;text-align:center;min-width:0;box-shadow:2px 2px 0 var(--ink)}
.tile>span{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.tile svg{max-width:100%;height:auto}
.bigv{font-family:var(--jp);font-size:27px;line-height:1.1}.bigv small{font-family:var(--font);font-size:14px;color:var(--mute)}
.up{color:var(--red)}.dn{color:var(--mint)}
.dots{display:flex;gap:3px;justify-content:center}.dots i{width:10px;height:10px;border:2px solid var(--ink);background:#fff;border-radius:50%}.dots i.on{background:var(--accent)}.dots i.td{box-shadow:0 0 0 2px var(--sun)}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qbtn{background:#fff;border:2.5px solid var(--ink);border-radius:4px;box-shadow:2px 2px 0 var(--ink);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:11.5px;text-transform:uppercase}
.qbtn svg{color:var(--accent)}
.qbtn:active{transform:translate(2px,2px);box-shadow:none}
/* listes */
.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border:0;border-bottom:2px dashed var(--line);background:none;width:100%;text-align:left;color:var(--ink)}
.li:last-child{border-bottom:0}
.li b{font-weight:700}
.mini{flex:none;width:58px;height:44px;border:2px solid var(--ink);border-radius:3px;overflow:hidden;display:grid;place-items:center}
.dt{flex:none;width:46px;height:46px;border:2.5px solid var(--ink);background:var(--accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;border-radius:3px}
.dt b{font-family:var(--jp);font-size:18px;font-weight:400}.dt small{font-size:10px;font-weight:700}
.day{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:2px dashed var(--line)}
.day.nxt{background:#fff4e6;padding-inline:10px;border:2.5px solid var(--accent);border-radius:3px;margin:4px 0}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.ph b{font-family:var(--jp);font-weight:400;font-size:19px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;text-align:center}
.kv div{background:#fff;border:2.5px solid var(--ink);border-radius:3px;padding:8px 4px;min-width:0}
.kv b{display:block;font-family:var(--jp);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums}
.kv small{color:var(--mute);font-weight:700;font-size:11px}
.heat{overflow-x:auto}.heat table{border-collapse:separate;border-spacing:3px}
.heat td{width:18px;height:18px;padding:0;border:1.5px solid rgba(26,23,22,.35);border-radius:3px}
.heat th{font-weight:700;font-size:11px;color:var(--mute);padding-right:4px;text-align:right}
/* exercices */
input[type=search]{margin-bottom:6px}
.bmw{max-width:300px;margin:8px auto 0;padding:6px;border:2.5px solid var(--ink);border-radius:3px}.bmw.sm{max-width:150px;margin:0;padding:3px}
.bmap{display:block;width:100%;height:auto}
.mz{cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:2.5px solid var(--ink);border-radius:99px;background:#fff;color:var(--ink);padding:5px 12px;font-weight:700;font-size:13px}
.chip.sm{font-size:12px;padding:4px 10px;border-width:2px}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:2px 2px 0 var(--ink)}
.exc{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:2px dashed var(--line);padding:10px 2px;text-align:left;color:var(--ink)}
.exc:last-child{border-bottom:0}
.thumb{flex:none;width:84px;height:62px;border:2.5px solid var(--ink);border-radius:3px;overflow:hidden;display:grid;place-items:center}
.exc b{font-size:15px;font-weight:700}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0}
.tag{display:inline-block;font-size:10.5px;font-weight:900;color:#fff;padding:1px 8px;border:2px solid var(--ink);border-radius:99px}
.tag.ghost{background:#fff;color:var(--ink)}
.lvd{flex:none;display:flex;gap:2px}.lvd i{width:7px;height:16px;border:1.8px solid var(--ink);background:#fff;border-radius:2px}.lvd i.on{background:var(--accent)}
.stage{border:3px solid var(--ink);border-radius:3px;overflow:hidden;box-shadow:5px 5px 0 var(--ink)}
.animbox{width:100%;aspect-ratio:200/146}
.animbox.sm{max-width:260px;margin:8px auto;border:2.5px solid var(--ink)}
.stagebar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:3px solid var(--ink);background:var(--accent);color:#fff}
.stagebar .sub{flex:1;color:#fff}.stagebar .ico{color:#fff}
.two{display:flex;gap:12px;align-items:center}
.mlist{display:flex;gap:5px;flex-wrap:wrap}
.mtag{font-size:12px;font-weight:700;border:2px solid var(--ink);border-radius:99px;padding:2px 9px;background:#ffd6dc}
.mtag.p{background:#ff1e3c;color:#fff}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:15px}
.steps li::before{content:counter(s);flex:none;width:27px;height:27px;background:var(--accent);color:#fff;border:2.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--jp);font-size:13px}
.bul{margin:0;padding-left:0;list-style:none;display:grid;gap:7px}
.bul li{display:flex;gap:8px;font-weight:700;font-size:14.5px}
.bul.ok li::before{content:"○";color:var(--mint);font-weight:900}
.bul.no li::before{content:"✕";color:var(--red);font-weight:900}
.sticky-act{margin-top:18px}
/* nutrition */
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.dnav b{font-family:var(--jp);font-weight:400;font-size:17px}
.nsum{display:flex;gap:12px;align-items:center}
.rest{font-weight:700;font-size:15px;margin-bottom:6px}.rest b{color:var(--accent);font-family:var(--jp);font-weight:400;font-size:19px}.rest.neg b{color:var(--red)}
.mac{margin-top:6px}.ml{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700}.ml span{color:var(--mute)}
.water{display:flex;gap:5px;flex-wrap:wrap}
.gl{width:30px;height:38px;padding:0;border:0;background:none}.gl svg{width:100%;height:100%}
.mh{display:flex;justify-content:space-between;align-items:baseline}.mh b{font-family:var(--jp);font-weight:400;font-size:17px}
.fi{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:2px dashed var(--line)}
.fi b{font-size:14.5px}.kc{font-weight:900;font-variant-numeric:tabular-nums}
.addl{background:#fff;color:var(--ink);border:2px dashed var(--ink);border-radius:4px;padding:7px 12px;font-weight:700;font-size:13.5px;margin-top:8px}
.chart{display:block;width:100%;height:auto;margin-top:8px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g2 label{font-size:12px;font-weight:700;color:var(--mute);display:grid;gap:4px}
.prev{margin:12px 0}
/* corps */
.wtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
details{margin-top:10px}summary{font-weight:700;cursor:pointer;color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.pth{position:relative;padding:0;border:2.5px solid var(--ink);border-radius:3px;overflow:hidden;aspect-ratio:3/4;background:var(--card2)}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth span{position:absolute;left:0;bottom:0;background:var(--ink);color:#fff;font-size:10px;font-weight:700;padding:2px 6px}
.pth.sel{outline:4px solid var(--accent);outline-offset:-4px}
.phprev{border:3px solid var(--ink);border-radius:3px;overflow:hidden;background:#000}.phprev img{display:block;width:100%;max-height:60vh;object-fit:contain}
.cmp{position:relative;border:3px solid var(--ink);border-radius:3px;overflow:hidden;background:#000;margin-top:10px;aspect-ratio:3/4}
.cmp>img,.cmpa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmpa{position:absolute;inset:0}
.cmpl{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 0 2px var(--ink)}
.ctag{position:absolute;bottom:8px;background:#fff;color:var(--ink);border:2px solid var(--ink);font-size:11px;font-weight:900;padding:2px 8px;border-radius:99px}.ctag.l{left:8px}.ctag.r{right:8px;background:var(--accent);color:#fff}
.side{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.side figure{margin:0}.side img{width:100%;aspect-ratio:3/4;object-fit:cover;border:2.5px solid var(--ink);display:block}.side figcaption{font-size:12px;font-weight:700;text-align:center;margin-top:4px}
.mtab{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mc{background:#fff;border:2.5px solid var(--ink);border-radius:3px;padding:8px;display:flex;flex-direction:column;min-width:0}

const PH={list:[],ok:true,db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open("forge",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"});
    r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>{this.ok=false;res(false)}}catch(e){this.ok=false;res(false)}})},
  async load(){if(!await this.open())return;await new Promise(res=>{try{const tx=this.db.transaction("photos","readonly").objectStore("photos").getAll();tx.onsuccess=()=>{this.list=(tx.result||[]).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.ts-a.ts);res()};tx.onerror=()=>res()}catch(e){res()}})},
  put(p){this.list.unshift(p);this.list.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.ts-a.ts);if(!this.db)return;try{this.db.transaction("photos","readwrite").objectStore("photos").put(p)}catch(e){}},
  del(id){this.list=this.list.filter(p=>p.id!==id);if(!this.db)return;try{this.db.transaction("photos","readwrite").objectStore("photos").delete(id)}catch(e){}},
  clear(){this.list=[];if(!this.db)return;try{this.db.transaction("photos","readwrite").objectStore("photos").clear()}catch(e){}}
};
function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const m=1100,r=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

const exF={q:"",g:null,m:null,eq:null};
function exMatches(e){const q=exF.q.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const nm=e.n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  return (!q||nm.includes(q))&&(!exF.g||e.g===exF.g)&&(!exF.m||e.m.includes(exF.m)||(e.s||[]).includes(exF.m))&&(!exF.eq||e.eq===exF.eq)}

  <div class="tags"><span class="tag" style="background:${gc}">${(GROUPS.find(z=>z[0]===e.g)||["","Perso"])[1]}</span><span class="tag ghost">${EQ[e.eq]||e.eq}</span></div>
  <div class="sub">${e.m.map(m=>MUS[m]).join(", ")}</div></div><span class="lvd" aria-label="${LVL[e.l]}">${[1,2,3].map(i=>`<i class="${i<=e.l?"on":""}"></i>`).join("")}</span></button>`}
function vExos(){

    <div class="chips" id="gChips"><button class="chip" data-g="" aria-pressed="${!exF.g}">Tous</button>${GROUPS.map(([k,l])=>`<button class="chip" data-g="${k}" aria-pressed="${exF.g===k}">${l}</button>`).join("")}</div>

    list.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>exDetail(b.dataset.ex));list.querySelector("#newEx").onclick=()=>customExForm()};

    ${PH.ok?"":`<p class="sub">Le stockage des photos n'est pas disponible dans ce navigateur : elles disparaîtront à la fermeture.</p>`}`);

  if(pp.querySelector("#phCmp"))pp.querySelector("#phCmp").onclick=()=>photoGallery(true);
  // mensurations

  const mp=panel(stk("Mensurations","b")+(ml?`<div class="mtab">${MEAS.filter(([k])=>ml[k]!=null).map(([k,l])=>{const pv=ms.slice(0,-1).reverse().find(x=>x[k]!=null);const d=pv?ml[k]-pv[k]:null;

  panel(stk(`Succès ${Object.keys(S.badges).length}/${BADGES.length}`)+`<div class="grid2">${BADGES.map(b=>`<div class="badge${S.badges[b.id]?"":" lock"}">${medalSVG(b.c,!!S.badges[b.id])}<div style="min-width:0"><b>${b.n}</b><span>${b.d}</span></div></div>`).join("")}</div>`);

let zTop=30;
function sheet(title,build,opt){opt=opt||{};const back=document.createElement("div");back.className="back";back.style.zIndex=++zTop;
  back.innerHTML=`<div class="sheet${opt.full?" full":""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="hd"><span class="h2">${title}</span><button class="ico x" aria-label="${opt.closeLabel||"Fermer"}">${opt.closeIcon||"✕"}</button></div><div class="sb"></div></div>`;
  document.body.appendChild(back);document.body.classList.add("noscroll");const body=back.querySelector(".sb");
  const close=()=>{back.remove();if(!document.querySelector(".back"))document.body.classList.remove("noscroll");opt.onClose&&opt.onClose()};
  back.querySelector(".x").onclick=close;back.onclick=e=>{if(e.target===back&&!opt.sticky)close()};
  const h={close,body,back,setTitle:t=>back.querySelector(".h2").innerHTML=t};build(body,close,h);return h}
const restLbl=v=>v<60?v+" s":v%60?Math.floor(v/60)+" min "+(v%60):(v/60)+" min";
function twoTap(btn,label,fn){btn.onclick=()=>{if(btn.dataset.armed){fn();return}btn.dataset.armed="1";const old=btn.innerHTML;btn.innerHTML=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.innerHTML=old}},3000)}}

/* ---------- Fiche exercice ---------- */
function exDetail(id){const e=exById(id);
  sheet(esc(e.n),(b,close)=>{
    const h=exHistory(id),best=exBest(id),r=liftRank(id),P=POSES[e.a]||{};
    b.innerHTML=`<div class="stage"><div id="anim" class="animbox"></div><div class="stagebar"><span class="pill">${P.v==="front"?"Vue de face":"Vue de profil"}</span><span class="sub">En rouge : muscles travaillés</span><button class="ico" id="pp" aria-label="Pause">${icon(calm()?"play":"pause",18)}</button></div></div>
      <div class="tags" style="margin:12px 0 4px"><span class="tag" style="background:${GCOL[e.g]||"#999"}">${(GROUPS.find(z=>z[0]===e.g)||["","Perso"])[1]}</span><span class="tag ghost">${EQ[e.eq]||e.eq}</span><span class="tag ghost">${LVL[e.l]||""}</span><span class="tag ghost">${e.c?"Polyarticulaire":"Isolation"}</span>${e.t?`<span class="tag ghost">Chronométré</span>`:""}</div>
      <div class="two"><div class="bmw sm">${bodyMap({p:e.m,s:e.s})}</div><div class="grow"><div class="lbl">Muscles principaux</div><div class="mlist">${e.m.map(m=>`<span class="mtag p">${MUS[m]}</span>`).join("")}</div>${(e.s||[]).length?`<div class="lbl" style="margin-top:8px">Muscles secondaires</div><div class="mlist">${e.s.map(m=>`<span class="mtag">${MUS[m]}</span>`).join("")}</div>`:""}</div></div>
      ${e.st&&e.st.length?`<div class="blk">${stk("Exécution","p")}<ol class="steps">${e.st.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`:""}
      ${e.tp&&e.tp.length?`<div class="blk">${stk("Conseils","m")}<ul class="bul ok">${e.tp.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`:""}
      ${e.er&&e.er.length?`<div class="blk">${stk("Erreurs fréquentes","v")}<ul class="bul no">${e.er.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`:""}
      <div class="blk">${stk("Mes performances","b")}${best?`<div class="kv"><div><b>${e.t?nf(best.r,0)+" s":best.e1?nf(best.e1,1):nf(best.r,0)}</b><small>${e.t?"Meilleur temps":best.e1?"1RM estimé (kg)":"Reps max"}</small></div><div><b>${best.w?nf(best.w,1):"–"}</b><small>Charge max (kg)</small></div><div><b>${h.length}</b><small>Séances</small></div></div>
        ${r?`<div class="li" style="margin-top:10px">${rankBadge(r.r,36)}<div class="grow"><b>Rang ${r.r}</b><div class="sub">${nf(r.ratio,2)} × ton poids de corps${r.next?` · rang suivant : ${nf(r.next*lastWeight(),0)} kg en 1RM`:" · rang maximal !"}</div></div></div>`:""}
        ${h.length>1?lineChart(h.map(x=>({d:x.d,v:e.t?x.maxR:(x.best||x.maxR)})),{id:"ex",dec:e.t||!best.e1?0:1,label:"Progression"}):""}
        <div class="lbl" style="margin-top:8px">Dernière fois (${fmtD(best.last.d)})</div><div class="sub">${best.last.sets.map(s=>(s.w?nf(s.w)+" kg × ":"")+s.r+(e.t?" s":"")).join(" · ")}</div>`:`<p class="mute">Pas encore réalisé. Ajoute-le à une séance pour suivre ta progression.</p>`}</div>
      <div class="row sticky-act">${S.live?`<button class="btn" id="toLive">+ À la séance en cours</button>`:""}<button class="btn ${S.live?"alt":""}" id="toProg">+ À un programme</button>${e.custom?`<button class="btn danger" id="delEx">Supprimer</button>`:""}</div>`;
    ANIM.start(b.querySelector("#anim"),e);
    b.querySelector("#pp").onclick=ev=>{const p=ANIM.toggle();ev.currentTarget.innerHTML=icon(p?"play":"pause",18);ev.currentTarget.setAttribute("aria-label",p?"Lecture":"Pause")};
    if(b.querySelector("#toLive"))b.querySelector("#toLive").onclick=()=>{liveAdd(id);close();LIVE.show()};
    b.querySelector("#toProg").onclick=()=>addToProgram(id);
    if(b.querySelector("#delEx"))twoTap(b.querySelector("#delEx"),"Confirmer",()=>{S.customEx=S.customEx.filter(x=>x.id!==id);save();close();refresh();toast("Exercice supprimé")});
  },{full:true,onClose:()=>ANIM.stop()})}

  tick(){const left=Math.max(0,Math.ceil((this.end-Date.now())/1000));if(!this.el)return;this.el.querySelector("#rtT").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
    this.el.querySelector("#rtB").style.width=(this.total?left/this.total*100:0)+"%";if(left<=0){this.stop();beep();toast("Repos terminé, série suivante ! 💪")}},
  stop(){clearInterval(this.int);if(this.el){this.el.remove();this.el=null}}};
const LIVE={open:false,h:null,clock:null,

function finishWorkout(){const L=S.live;if(!L)return;
  const ex=L.ex.map(x=>({e:x.e,sets:x.sets.filter(s=>s.ok).map(s=>({w:num(s.w)||0,r:num(s.r)||0}))})).filter(x=>x.sets.length);
  if(!ex.length){toast("Valide au moins une série avec ✓ avant de terminer");return}
  const prs=[];ex.forEach(x=>{const b=exBest(x.e);const cur=Math.max(...x.sets.map(s=>e1rm(s.w,s.r))),curR=Math.max(...x.sets.map(s=>s.r));
    if(b&&((cur&&cur>b.e1+.01)||(!cur&&!b.e1&&curR>b.r)))prs.push(x.e)});
  const vol=Math.round(ex.reduce((a,x)=>a+x.sets.reduce((c,s)=>c+s.w*s.r,0),0)),nsets=ex.reduce((a,x)=>a+x.sets.length,0);
  const dur=Math.max(1,Math.round((Date.now()-L.start)/60000));const xp=Math.min(220,40+nsets*4+prs.length*25);
  const ses={id:uid(),d:TODAY,dur,n:L.name,pid:L.pid,did:L.did,ex,vol,xp,prs};S.sessions.push(ses);
  const P=S.programs.find(p=>p.id===L.pid);if(P){const i=P.days.findIndex(d=>d.id===L.did);if(i>=0)P.next=(i+1)%P.days.length}
  S.live=null;REST.stop();const lvl0=S.lvl;gainXP(xp);const nb=checkBadges();save();
  if(LIVE.h)LIVE.h.close();
  sheet("Séance terminée !",(b,close)=>{b.innerHTML=`<div class="center"><div class="burst">勝利！</div><div class="h2" style="margin-top:4px">Victoire</div><div class="h2">${esc(ses.n)}</div><div class="sub">${fmtDL(TODAY)}</div></div>

    ${prs.length?`<div class="blk">${stk("Nouveaux records 🏆","p")}${prs.map(id=>{const b2=exBest(id);return `<div class="li"><div class="mini">${figSVG(exById(id),.8,{hl:false})}</div><div class="grow"><b>${esc(exById(id).n)}</b><div class="sub">${b2&&b2.e1?"1RM estimé "+nf(b2.e1)+" kg":"Reps max "+(b2?b2.r:"")}</div></div><span class="pill gold">PR</span></div>`}).join("")}</div>`:""}

    <button class="btn big" id="ok" style="width:100%;margin-top:14px">Super !</button>`;b.querySelector("#ok").onclick=close},{onClose:()=>refresh()});
  refresh()}

const KEYK="forge_apikey";
const AI={sample:null,checked:false,
  async init(){try{if(window.claude&&typeof window.claude.use==="function"){const s=await window.claude.use("sample");if(s){const lim=await s.limits().catch(()=>null);if(lim&&lim.images)this.sample=s}}}catch(e){}this.checked=true},
  key(){try{return localStorage.getItem(KEYK)||""}catch(e){return ""}},
  mode(){return this.sample?"claude":(this.key()?"api":null)},
  prompt(note){return `Tu es nutritionniste du sport. Analyse la photo de ce repas.
1. Identifie chaque aliment visible (sauces, huiles et boissons comprises si on les voit).

function coachPrompt(o,allowedEx){const D=coachData(),p=S.profile,t=targets();
  const lifts=Object.keys(STD).map(id=>{const r=liftRank(id);return r?`${exById(id).n} : 1RM estimé ${Math.round(r.e1)} kg (rang ${r.r})`:null}).filter(Boolean);
  return `Tu es un préparateur physique expérimenté. Crée un programme de musculation hebdomadaire sur mesure, en français.
PROFIL : ${p.sex==="f"?"femme":"homme"}, ${p.age} ans, ${p.height} cm, ${D.w?D.w+" kg":"poids inconnu"}.
OBJECTIF : ${CGOALS[o.goal].n}. NIVEAU : ${CLVL[o.lvl]}. ${o.days} séances par semaine, environ ${o.dur} minutes chacune. MATÉRIEL : ${CEQUIP[o.equip].n}.
PRIORITÉS : ${o.prio.map(x=>CPRIO[x][0]).join(", ")||"aucune"}. GÊNES / DOULEURS : ${o.pain.map(x=>CPAIN[x].n).join(", ")||"aucune"}.
HISTORIQUE : ${D.n} séances enregistrées, environ ${nf(D.freq,1)} par semaine sur les 4 dernières semaines. ${lifts.length?"Performances : "+lifts.join(" ; ")+".":""} Besoins estimés : ${t.kcal} kcal, ${t.prot} g de protéines par jour.
Utilise UNIQUEMENT des exercices de cette liste (identifiant : nom) :
${allowedEx.map(e=>`${e.id} : ${e.n} (${(GROUPS.find(g=>g[0]===e.g)||["",""])[1]}, ${EQ[e.eq]})`).join("\n")}
Règles : exactement ${o.days} jours ; 4 à 8 exercices par jour ; respecte la durée ; commence par les mouvements polyarticulaires ; adapte séries, répétitions et repos à l'objectif ; équilibre poussée/tirage.
Réponds uniquement avec un objet JSON de cette forme :
{"nom":"nom court du programme","explication":["3 à 6 phrases courtes qui justifient tes choix à partir des données"],"jours":[{"nom":"Push","exos":[{"id":"dc_barre","series":4,"reps":"6-8","repos":150}]}]}`}
function coachSheet(){
  const D=coachData();S.coach=Object.assign({goal:{maintien:"forme"}[S.profile.goal]||S.profile.goal||"masse",lvl:D.lvl,days:D.days,dur:60,equip:"salle",prio:[],pain:[]},S.coach||{});
  const o=S.coach;let res=null,variant=0,busy=false,ctl=null;
  sheet("Coach · Mon programme",(b,close)=>{
    const ch=(id,opts,val,multi)=>`<div class="chips" data-grp="${id}">${opts.map(([k,l])=>`<button class="chip sm" data-v="${k}" aria-pressed="${multi?val.includes(k):String(val)===String(k)}">${l}</button>`).join("")}</div>`;
    const draw=()=>{
      if(busy){b.innerHTML=`<div class="scanning"><div class="spin"></div><b>Claude prépare ton programme…</b><span class="sub">Analyse de tes données et choix des exercices (20 à 60 secondes).</span></div><button class="btn alt" id="stop" style="width:100%">Arrêter</button>`;b.querySelector("#stop").onclick=()=>ctl&&ctl.abort();return}
      if(res){b.innerHTML=`<div class="panel coachP"><div class="big">${esc(res.n)}</div><div class="sub">${res.days.length} séances · ${res.days.reduce((a,d)=>a+d.items.length,0)} exercices${res.ai?" · version Claude":""}</div></div>
        <div class="lbl">Pourquoi ce programme</div><ul class="why">${res.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>
        ${res.days.map(d=>`<div class="gday"><h3>${esc(d.n)} <span class="sub" style="font-family:var(--font);font-style:normal;text-transform:none">· ~${estMin(d)} min</span></h3>${d.items.map(x=>`<button class="li" data-info="${x.e}"><div class="mini">${figSVG(exById(x.e),.75,{hl:false})}</div><div class="grow"><b>${esc(exById(x.e).n)}</b><div class="sub">${x.s} × ${esc(x.r)}${exById(x.e).t?" s":""} · repos ${restLbl(x.rest)}</div></div></button>`).join("")}</div>`).join("")}
        <button class="btn big" id="act" style="width:100%;margin-top:16px">Activer ce programme</button>
        <div class="row" style="margin-top:12px"><button class="btn alt" id="var">Autre variante</button><button class="btn alt" id="back">Modifier mes choix</button></div>
        ${AI.mode()&&!res.ai?`<button class="btn alt" id="ai" style="width:100%;margin-top:12px">${icon("exos",18)} Version sur mesure par Claude</button>`:""}
        <p class="sub" style="margin-top:12px">Tu pourras tout ajuster ensuite dans « Modifier ». Les charges se préremplissent à partir de tes séances.</p>`;
        b.querySelectorAll("[data-info]").forEach(x=>x.onclick=()=>exDetail(x.dataset.info));
        b.querySelector("#act").onclick=()=>{const p={id:uid(),n:res.n,next:0,coach:true,why:res.why,days:res.days.map(d=>({id:uid(),n:d.n,items:d.items.map(i=>Object.assign({},i))}))};S.programs.push(p);S.active=p.id;save();close();go("seances");refresh();toast("Programme activé ! 💪")};
        b.querySelector("#var").onclick=()=>{variant++;res=Object.assign(genProgram(o,variant),{});draw();b.parentElement.scrollTop=0};
        b.querySelector("#back").onclick=()=>{res=null;draw()};
        if(b.querySelector("#ai"))b.querySelector("#ai").onclick=async()=>{const okEq=CEQUIP[o.equip].ok,ban=new Set(o.pain.flatMap(p=>CPAIN[p].ex));const allow=EXALL().filter(e=>okEq.includes(e.eq)&&!ban.has(e.id));
          ctl=new AbortController();busy=true;draw();
          try{const r=await AI.askJSON(coachPrompt(o,allow),ctl.signal);const ids=new Set(allow.map(e=>e.id));
            const days=(Array.isArray(r&&r.jours)?r.jours:[]).slice(0,7).map((d,i)=>({id:uid(),n:String(d.nom||"Jour "+(i+1)).slice(0,40),items:(Array.isArray(d.exos)?d.exos:[]).filter(x=>ids.has(String(x.id))).slice(0,10).map(x=>({e:String(x.id),s:clamp(parseInt(x.series)||3,1,8),r:String(x.reps||"10").slice(0,8),rest:clamp(parseInt(x.repos)||90,20,300)}))})).filter(d=>d.items.length);
            busy=false;if(!days.length){toast("La réponse ne contenait pas de programme utilisable");draw();return}
            res={n:String(r.nom||"Programme Claude").slice(0,50),days,why:(Array.isArray(r.explication)?r.explication:[]).map(String).slice(0,8),ai:true};draw()}
          catch(e){busy=false;draw();if(!(e&&(e.code==="cancelled"||e.name==="AbortError")))toast(aiErr(e&&e.code))}};
        return}
      b.innerHTML=`<div class="panel coachP"><div class="big">Ton coach analyse tes données</div><div class="kv" style="margin-top:10px"><div><b>${D.n}</b><small>Séances</small></div><div><b>${nf(D.freq,1)}</b><small>Par semaine</small></div><div><b>${D.w?nf(D.w):"–"}</b><small>Poids (kg)</small></div></div>
        <p class="sub" style="margin-bottom:0">Niveau estimé : <b style="color:var(--fg)">${CLVL[D.lvl]}</b>${D.best?` · meilleur rang ${D.best.r.r} (${esc(exById(D.best.id).n)})`:""}${D.weak?` · point faible : ${esc(exById(D.weak.id).n)}`:""}</p></div>
        <div class="lbl">Objectif</div>${ch("goal",Object.entries(CGOALS).map(([k,v])=>[k,v.n]),o.goal)}
        <div class="lbl">Niveau</div>${ch("lvl",Object.entries(CLVL),o.lvl)}
        <div class="lbl">Séances par semaine</div>${ch("days",[2,3,4,5,6].map(n=>[n,n+" j"]),o.days)}
        <div class="lbl">Durée d'une séance</div>${ch("dur",[30,45,60,75,90].map(n=>[n,n+" min"]),o.dur)}
        <div class="lbl">Matériel</div>${ch("equip",Object.entries(CEQUIP).map(([k,v])=>[k,v.n]),o.equip)}
        <div class="lbl">Muscles prioritaires (facultatif)</div>${ch("prio",Object.entries(CPRIO).map(([k,v])=>[k,v[0]]),o.prio,1)}
        <div class="lbl">Gênes ou douleurs (facultatif)</div>${ch("pain",Object.entries(CPAIN).map(([k,v])=>[k,v.n]),o.pain,1)}
        <button class="btn big" id="gen" style="width:100%;margin-top:18px">Générer mon programme</button>`;
      b.querySelectorAll("[data-grp]").forEach(g=>g.querySelectorAll("[data-v]").forEach(x=>x.onclick=()=>{const k=g.dataset.grp,v=x.dataset.v;
        if(k==="prio"||k==="pain"){o[k]=o[k].includes(v)?o[k].filter(z=>z!==v):o[k].concat(v)}else o[k]=["days","dur"].includes(k)?+v:v;save();draw()}));
      b.querySelector("#gen").onclick=()=>{variant=0;res=genProgram(o,0);draw();b.parentElement.scrollTop=0}};
    draw()},{full:true,onClose:()=>ctl&&ctl.abort()})}

/* ================== DÉMARRAGE ================== */
$("gearBtn").onclick=settings;
applySet();
AI.init();
renderTop();renderNav();renderView(true);
PH.load().then(()=>{checkBadges();save();if(tab==="corps"||tab==="home")renderView(false)});
if(S.live)setTimeout(()=>toast("Une séance est en cours : touche « Reprendre »"),600);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const n=new Date();n.setHours(12,0,0,0);if(key(n)!==TODAY){NOW=n;TODAY=key(n);refresh()}}});

})();
</script>
